<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Deiniol.ca Index</title>
	<link rel="stylesheet" href="styles/sesi.css" />
	<link rel="icon" type="image/png" href="./tiny_gardens/assets/graphics/ui/uCREDITS.png" />

	<style>
		html,
		body {
			height: 100%;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			margin-top: auto;
			margin-bottom: auto;
			background: #111;
			min-height: 900px;
			overflow: hidden;
		}

		header {
			margin: auto;
			text-align: center;
			font-size: xx-large;
			text-wrap: nowrap;
		}

		.siteContainer {
			align-items: center;
			display: flex;
			justify-content: center;
			height: 100%;
			width: 100%;
		}

		#screen {
			position: relative;
			background: black;
			width: min(1366px);
			height: min(768px);
			border: 2px solid white;
			display: flex;
			flex-direction: column;
			overflow: hidden;

			/* CRT effects - shadows and glow! */
			box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
			filter: contrast(1.1) saturate(1.2) brightness(0.9);
		}

		/* Scanlines */
		#screen::before {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: repeating-linear-gradient(to bottom,
					rgba(255, 255, 255, 0.05) 0px,
					rgba(255, 255, 255, 0.05) 1px,
					transparent 2px);
			pointer-events: none;
			z-index: 2;
		}

		/* Subtle flicker */
		#screen::after {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(255, 255, 255, 0.02);
			animation: flicker 0.15s infinite;
			pointer-events: none;
			z-index: 3;
		}

		@keyframes flicker {
			0% {
				opacity: 0.1;
			}

			50% {
				opacity: 0.2;
			}

			100% {
				opacity: 0.1;
			}
		}

		header {
			text-align: center;
			margin: 20px;
			text-shadow: 0 0 8px white;
			font-family: monospace;
		}
	</style>
</head>

<body>
	<div class="siteContainer">
		<div id="screen">
			<div id="titleArea">
				<header>
					<h1>[ deiniol.ca ]</h1>
				</header>
			</div>
			<div id="optionsArea">

			</div>
		</div>
	</div>
</body>

</html>
